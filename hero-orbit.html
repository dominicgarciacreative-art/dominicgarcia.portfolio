<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dominic Garcia — Creative Designer · hero preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@200;300;400;500;600&family=Archivo:wdth,wght@125,900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#141412;--paper:#fff;--line:rgba(20,20,18,.14);--accent:#c8c060;--mono:'Azeret Mono',monospace}
  html{-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}

  /* top strip */
  .strip{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;
    mix-blend-mode:difference;color:#fff;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
  .strip nav{display:flex;gap:26px}

  /* the pinned stage: the page scrolls while this stays put */
  .orbit{position:relative;height:340vh}
  .stage{position:sticky;top:0;height:100svh;overflow:hidden;background:var(--paper);perspective:1400px}
  .rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .rings ellipse{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
  .tiles{position:absolute;inset:0;pointer-events:none}
  .tile{position:absolute;left:0;top:0;margin:0;border-radius:14px;overflow:hidden;background:#e9e9e4;
    box-shadow:0 18px 40px -14px rgba(20,20,18,.45),0 0 0 1px rgba(20,20,18,.06);will-change:transform,opacity}
  .tile img{display:block;width:100%;height:100%;object-fit:cover}

  .headline{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;will-change:transform,opacity}
  .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:400;color:#6a6a62;margin-bottom:22px}
  h1{font-family:'Archivo',sans-serif;font-weight:900;font-stretch:125%;font-size:clamp(34px,9.4vw,138px);line-height:.92;letter-spacing:-.03em}
  h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-stretch:100%;letter-spacing:-.01em}
  .sub{max-width:460px;margin:26px auto 0;color:#4a4a44;font-weight:300;font-size:13.5px}
  .cta{margin-top:30px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;pointer-events:auto}
  .btn{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border-radius:100px;padding:14px 30px;border:1px solid var(--ink)}
  .btn.solid{background:var(--ink);color:#fff}
  .hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#6a6a62;display:flex;flex-direction:column;align-items:center;gap:10px}
  .hint i{width:1px;height:34px;background:linear-gradient(var(--ink),transparent);animation:drip 1.8s ease-in-out infinite;transform-origin:top}
  @keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

  /* after the spin: the work lands */
  .landing{padding:16vh 28px 18vh;max-width:1280px;margin:0 auto}
  .landing .label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#6a6a62;margin-bottom:18px}
  .landing h2{font-family:'Archivo',sans-serif;font-weight:900;font-stretch:125%;font-size:clamp(30px,6vw,84px);line-height:.95;letter-spacing:-.025em;max-width:14ch}
  .grid{margin-top:9vh;display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
  .card{margin:0;border-radius:14px;overflow:hidden;background:#e9e9e4;opacity:0;transform:translate(var(--dx,0),var(--dy,90px)) rotate(var(--r,0deg)) scale(.92);
    transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
  .card.in{opacity:1;transform:none}
  .card img{display:block;width:100%;height:100%;object-fit:cover}
  .c1{grid-column:1/6;aspect-ratio:4/5}.c1 img{object-position:top}.c2{grid-column:6/13;aspect-ratio:16/10}
  .c3{grid-column:1/5;aspect-ratio:1}.c4{grid-column:5/9;aspect-ratio:1}.c5{grid-column:9/13;aspect-ratio:1}
  .c6{grid-column:1/8;aspect-ratio:16/9}.c7{grid-column:8/13;aspect-ratio:4/5}
  @media(max-width:700px){
    .strip{padding:14px 18px}.strip nav{gap:14px}
    .grid{gap:10px}.c1,.c2,.c6{grid-column:1/13}.c3,.c4{grid-column:span 6}.c5{grid-column:1/13}.c7{grid-column:1/13}
  }
  @media(prefers-reduced-motion:reduce){.card{transition:none;opacity:1;transform:none}.hint i{animation:none}}
</style>
</head>
<body>
<div class="strip"><a href="#">Dominic Garcia</a><nav><a href="#work">Works</a><a href="#">About</a><a href="#">Contact</a></nav></div>

<section class="orbit" id="orbit">
  <div class="stage">
    <svg class="rings" id="rings" aria-hidden="true"></svg>
    <div class="tiles" id="tiles" aria-hidden="true"></div>
    <div class="headline" id="headline">
      <div class="eyebrow">Dominic Garcia · Creative Designer</div>
      <h1>Welcome<br>to my <em>studio</em></h1>
      <p class="sub">Brands, ads, thumbnails and websites. A small studio that sweats the details.</p>
      <div class="cta"><a class="btn solid" href="#work">See the work</a><a class="btn" href="#">Get in touch</a></div>
    </div>
    <div class="hint"><span>Scroll</span><i></i></div>
  </div>
</section>

<section class="landing" id="work">
  <div class="label">Selected work</div>
  <h2>Pieces I made, in no particular orbit.</h2>
  <div class="grid" id="grid"></div>
</section>

<script>
(function(){
  "use strict";
  /* the pictures that orbit: real work, mixed shapes */
  var PICS = [
    ["assets/brandkit-letsfly-logo.jpg", 1.27], ["assets/thumb-rampage.jpg", 1.78], ["assets/ad-yuny-fitness.jpg", 1],
    ["assets/smc-popeyes-alabang.jpg", 1], ["assets/brandkit-mandialeaf-logo.jpg", 1.27], ["assets/ad-pldt-dragon.jpg", 1],
    ["assets/ad-km-blackfriday.jpg", 2], ["assets/thumb-case-study.jpg", 1.78], ["assets/ad-drip-6week-challenge.jpg", 1],
    ["assets/ad-monday-lets-rise.jpg", 1], ["assets/poster-iam-raquel.jpg", 1.4], ["assets/ad-bluefox-shield-collage.jpg", 1],
    ["assets/thumb-pykthos-welcome.jpg", 1.78], ["assets/ad-americanstandard-easy-clean.jpg", 1]
  ];
  /* three rings, each its own size, tilt, speed and direction */
  var RINGS = [
    {rx:.27, ry:.19, tilt:-7, speed: .045, n:4, size:.115},
    {rx:.39, ry:.29, tilt: 5, speed:-.032, n:6, size:.135},
    {rx:.52, ry:.39, tilt:-3, speed: .024, n:6, size:.15}
  ];
  var stage = document.querySelector(".stage"), orbit = document.getElementById("orbit"),
      tilesEl = document.getElementById("tiles"), ringsEl = document.getElementById("rings"),
      head = document.getElementById("headline"), hint = document.querySelector(".hint");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* build tiles + ring outlines */
  var tiles = [], ellipses = [], k = 0, NS = "http://www.w3.org/2000/svg";
  RINGS.forEach(function(r, ri){
    var e = document.createElementNS(NS, "ellipse"); ringsEl.appendChild(e); ellipses.push(e);
    for(var i=0;i<r.n;i++){
      var p = PICS[k % PICS.length]; k++;
      var fig = document.createElement("figure"); fig.className = "tile";
      var img = new Image(); img.src = p[0]; img.alt = ""; img.decoding = "async"; fig.appendChild(img);
      tilesEl.appendChild(fig);
      tiles.push({el:fig, ring:r, ri:ri, a0:(i / r.n) * Math.PI * 2 + ri * .7, ratio:p[1]});
    }
  });

  var W = 0, H = 0, prog = 0, shown = 0, t0 = performance.now();
  function size(){ W = stage.clientWidth; H = stage.clientHeight; }
  function readProgress(){
    var r = orbit.getBoundingClientRect(), span = orbit.offsetHeight - window.innerHeight;
    prog = Math.min(1, Math.max(0, -r.top / span));
  }
  var ease = function(x){ return x*x*(3 - 2*x); };
  var band = function(a, b, x){ return Math.min(1, Math.max(0, (x - a) / (b - a))); };

  function frame(now){
    var t = reduce ? 0 : (now - t0) / 1000;
    shown += (prog - shown) * .09;                        // glide toward where the scroll is
    var p = shown, fly = ease(band(.18, 1, p));            // 0 while idle, 1 when everything has flown past
    var cx = W/2, cy = H/2, base = Math.min(W, H*1.25) * (W < 700 ? 1.9 : 1);

    RINGS.forEach(function(r, i){
      var e = ellipses[i], k2 = 1 + fly * 2.6;
      e.setAttribute("cx", cx); e.setAttribute("cy", cy);
      e.setAttribute("rx", r.rx * W * k2); e.setAttribute("ry", r.ry * H * k2);
      e.setAttribute("transform", "rotate(" + r.tilt + " " + cx + " " + cy + ")");
      e.style.opacity = .16 * (1 - band(.55, .95, p));
    });

    tiles.forEach(function(tl){
      var r = tl.ring, spin = t * r.speed * Math.PI * 2 + p * (r.speed > 0 ? 1 : -1) * Math.PI * 1.7;
      var a = tl.a0 + spin;
      var depth = (Math.sin(a) + 1) / 2;                   // 0 = far side, 1 = near side
      var grow = 1 + fly * (1.2 + depth * 3.2);
      var ex = r.rx * W * (1 + fly * 2.6), ey = r.ry * H * (1 + fly * 2.6);
      var x0 = Math.cos(a) * ex, y0 = Math.sin(a) * ey * (.55 + depth * .45);
      var rad = r.tilt * Math.PI / 180;
      var x = cx + x0 * Math.cos(rad) - y0 * Math.sin(rad), y = cy + x0 * Math.sin(rad) + y0 * Math.cos(rad);
      var w = base * r.size * (.62 + depth * .5) * grow, h = w / tl.ratio;
      var fade = 1 - band(.82, 1, p);
      tl.el.style.width = w + "px"; tl.el.style.height = h + "px";
      tl.el.style.opacity = (.5 + depth * .5) * fade;
      tl.el.style.zIndex = String(Math.round(depth * 4));         // the orbit passes behind the headline
      tl.el.style.transform = "translate3d(" + (x - w/2) + "px," + (y - h/2) + "px,0) rotate(" + (Math.cos(a) * 5 * (1 - fly)) + "deg)";
      tl.el.style.filter = depth < .35 ? "blur(" + ((.35 - depth) * 5) + "px)" : "none";
    });

    head.style.opacity = String(1 - ease(band(.1, .42, p)));
    head.style.transform = "translateY(" + (-p * 140) + "px) scale(" + (1 + p * .12) + ")";
    head.style.pointerEvents = p > .35 ? "none" : "";
    hint.style.opacity = String(1 - band(0, .06, p));
    requestAnimationFrame(frame);
  }

  size(); readProgress(); shown = prog;
  window.addEventListener("resize", function(){ size(); readProgress(); });
  window.addEventListener("scroll", readProgress, {passive:true});
  requestAnimationFrame(frame);

  /* after the hero: the work arrives as you scroll */
  var GRID = ["assets/billboard-pldt.jpg","assets/thumb-rampage.jpg","assets/ad-yuny-fitness.jpg","assets/brandkit-letsfly-logo.jpg",
              "assets/smc-popeyes-alabang.jpg","assets/thumb-case-study.jpg","assets/ad-pldt-dragon.jpg"];
  var FROM = [["-120px","60px","-5deg"],["140px","40px","4deg"],["-80px","120px","-3deg"],["0px","140px","2deg"],["90px","120px","5deg"],["-140px","80px","-4deg"],["120px","100px","3deg"]];
  var grid = document.getElementById("grid");
  GRID.forEach(function(src, i){
    var c = document.createElement("figure"); c.className = "card c" + (i + 1);
    c.style.setProperty("--dx", FROM[i][0]); c.style.setProperty("--dy", FROM[i][1]); c.style.setProperty("--r", FROM[i][2]);
    c.style.setProperty("--d", (i % 3) * .08 + "s");
    var im = new Image(); im.src = src; im.alt = ""; im.loading = "lazy"; c.appendChild(im); grid.appendChild(c);
  });
  var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }); }, {threshold:.15});
  [].forEach.call(document.querySelectorAll(".card"), function(c){ io.observe(c); });
})();
</script>
</body>
</html>
