<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Media Ads — Creatives, Dominic Garcia</title>
<meta name="description" content="Social Media Ads by Dominic Garcia: square statics for paid social. Drip Fitness, PLDT Home, Bosch, Satyn and 8 more.">
<meta property="og:title" content="Social Media Ads — Dominic Garcia">
<meta property="og:description" content="12 pieces · Square statics for paid social">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-page:#e9e9e9;--bg-inverse:#0b0b0b;--bg-tile:#1c1c1c;--text-primary:#0b0b0b;--text-secondary:#5e5e5e;--text-inverse:#f4f4f2;--text-inverse-secondary:#a8a8a8;--border-default:#cfcfcf;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg-inverse);color:var(--text-primary);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500;line-height:1.3;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:96px}
a{color:inherit;text-decoration:none}
img{display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid #6aa6ff;outline-offset:3px}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 40px;color:var(--text-inverse)}
.back{display:inline-flex;align-items:center;gap:10px;font-size:15px;white-space:nowrap}
.ic{flex:none;display:grid;place-items:center}
.ic20{width:20px;height:20px}.ic22{width:22px;height:22px}
.back .ic img,.next a .ic img{transition:transform .3s var(--ease)}
.back:hover .ic img{transform:translateX(-3px)}
.close{flex:none;width:44px;height:44px;border-radius:999px;background:var(--bg-tile);display:grid;place-items:center;transition:transform .3s var(--ease),background .2s}
.close:hover{transform:rotate(90deg);background:#2a2a2a}

.sheet{width:min(1160px,calc(100% - 80px));margin:0 auto;display:flex;flex-direction:column;gap:56px;padding:64px 48px 48px;border-radius:20px;background:var(--bg-page)}
.heading{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:14px;color:var(--text-secondary);white-space:nowrap}
.heading h1{font-weight:600;font-size:clamp(44px,6.667vw,96px);line-height:1;letter-spacing:-.04em}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding-top:24px;border-top:1px solid var(--border-default)}
.meta div{display:flex;flex-direction:column;gap:6px;min-width:0}
.meta dt{font-size:14px;color:var(--text-secondary)}
.meta dd{font-size:18px;letter-spacing:-.01em}

.gallery{display:flex;flex-direction:column;gap:24px}
.row,.cols{display:flex;gap:24px;align-items:flex-start}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:24px}
.piece{position:relative;display:block;flex:var(--w) 1 0;min-width:0;border-radius:8px;overflow:hidden;background:#d9d9d6;cursor:zoom-in}
.col .piece{flex:none;width:100%}
.piece img{width:100%;height:auto;aspect-ratio:var(--w)/var(--h);object-fit:cover;transition:transform .6s var(--ease)}
.piece::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);pointer-events:none}
@media (hover:hover){.piece:hover img{transform:scale(1.025)}}

.next{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:32px;border-top:1px solid var(--border-default)}
.next span{font-size:14px;color:var(--text-secondary);white-space:nowrap}
.next a{display:inline-flex;align-items:center;gap:12px;font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.next a:hover .ic img{transform:translateX(4px)}

dialog.viewer{margin:auto;padding:0;border:0;background:transparent;color:var(--text-inverse);width:min(1180px,94vw);height:min(900px,92svh);max-width:none;max-height:none;overflow:visible}
dialog.viewer::backdrop{background:rgba(8,8,8,.9);backdrop-filter:blur(8px)}
dialog.viewer[open]{display:flex;flex-direction:column;gap:14px;animation:vIn .3s var(--ease)}
@keyframes vIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.v-head,.v-foot{display:flex;align-items:center;justify-content:space-between;gap:16px}
.v-head b{font-weight:500;font-size:18px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-close{flex:none;width:44px;height:44px;border-radius:999px;background:var(--bg-tile);display:grid;place-items:center;font-size:17px;transition:transform .3s var(--ease)}
.v-close:hover{transform:rotate(90deg)}
.v-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.v-scroll{max-width:100%;max-height:100%;overflow:auto;border-radius:10px;overscroll-behavior:contain}
.v-scroll img{display:block;max-width:100%;max-height:calc(min(900px,92svh) - 130px);object-fit:contain;animation:imgIn .3s var(--ease)}
.v-scroll.tall img{max-height:none;width:min(720px,100%)}
@keyframes imgIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.v-nav{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:999px;background:rgba(244,244,242,.92);color:var(--text-primary);display:grid;place-items:center;font-size:19px;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .25s var(--ease)}
.v-nav:hover{transform:scale(1.06)}
.v-prev{left:-6px}.v-next{right:-6px}
.v-foot{font-size:14px;color:var(--text-inverse-secondary)}

@media (prefers-reduced-motion:no-preference){
  .sheet{animation:sheetIn .8s var(--ease) both}
  @keyframes sheetIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
  .rv{opacity:0;transform:translateY(20px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--d,0) * 60ms)}
  .rv.in{opacity:1;transform:none}
}

@media (max-width:1000px){
  .sheet{gap:44px;padding:48px 32px 36px}
  .meta{grid-template-columns:repeat(2,1fr);row-gap:20px}
}
@media (max-width:759px){
  body{padding-bottom:40px}
  .topbar{padding:14px 16px}
  .close{width:40px;height:40px}
  .sheet{width:calc(100% - 24px);gap:32px;padding:32px 18px 24px;border-radius:14px}
  .meta dd{font-size:16px}
  .gallery{gap:12px}
  .row,.cols{gap:12px;flex-wrap:wrap}
  .row.n1 .piece,.row.n2 .piece{flex:1 0 100%}
  .row.n3 .piece,.row.n4 .piece{flex:1 0 calc(50% - 6px)}
  .row.n3 .piece:last-child{flex-basis:100%}
  .col{flex:1 0 calc(50% - 6px);gap:12px}
  .cols.c3 .col:last-child{flex-basis:100%}
  .next a{font-size:18px}
  dialog.viewer{width:100vw;height:100svh;padding:14px 10px;background:#0b0b0b}
  .v-scroll img{max-height:calc(100svh - 120px)}
  .v-nav{width:40px;height:40px;margin-top:-20px}
  .v-prev{left:4px}.v-next{right:4px}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="../"><span class="ic ic20"><img src="../work/ic-back.svg" alt=""></span>All projects</a>
  <a class="close" href="../" aria-label="Close folder"><span class="ic ic20"><img src="../work/ic-close.svg" alt=""></span></a>
</header>

<main class="sheet">
  <div class="heading">
    <p class="eyebrow">( 01 — Digital )</p>
    <h1>Social Media Ads</h1>
  </div>

  <dl class="meta">
    <div><dt>Group</dt><dd>Digital</dd></div>
    <div><dt>Pieces</dt><dd>12</dd></div>
    <div><dt>Formats</dt><dd>Square statics for paid social</dd></div>
    <div><dt>Brands</dt><dd>Drip Fitness, PLDT Home, Bosch, Satyn and 8 more</dd></div>
  </dl>

  <section class="gallery" aria-label="Social Media Ads pieces">
      <div class="row n3"><a class="piece rv" style="--w:339;--h:339;--d:0" href="../work/ad-drip-6week-challenge.webp" data-label="Drip 6week challenge" data-ratio="1.000" aria-label="Open Drip 6week challenge"><img src="../work/ad-drip-6week-challenge.webp" alt="Social Media Ads — Drip 6week challenge" width="339" height="339"></a><a class="piece rv" style="--w:339;--h:339;--d:1" href="../work/ad-tlg-orange.webp" data-label="Tlg orange" data-ratio="1.000" aria-label="Open Tlg orange"><img src="../work/ad-tlg-orange.webp" alt="Social Media Ads — Tlg orange" width="339" height="339"></a><a class="piece rv" style="--w:338;--h:339;--d:2" href="../work/ad-purple7-party-in-style.webp" data-label="Purple7 party in style" data-ratio="1.003" aria-label="Open Purple7 party in style"><img src="../work/ad-purple7-party-in-style.webp" alt="Social Media Ads — Purple7 party in style" width="338" height="339"></a></div>
      <div class="row n3"><a class="piece rv" style="--w:339;--h:339;--d:3" href="../work/ad-satyn-run-club.webp" data-label="Satyn run club" data-ratio="1.000" aria-label="Open Satyn run club"><img src="../work/ad-satyn-run-club.webp" alt="Social Media Ads — Satyn run club" width="339" height="339" loading="lazy" decoding="async"></a><a class="piece rv" style="--w:339;--h:339;--d:0" href="../work/ad-yuny-fitness.webp" data-label="Yuny fitness" data-ratio="1.000" aria-label="Open Yuny fitness"><img src="../work/ad-yuny-fitness.webp" alt="Social Media Ads — Yuny fitness" width="339" height="339" loading="lazy" decoding="async"></a><a class="piece rv" style="--w:338;--h:339;--d:1" href="../work/ad-cloudshare-nexora-chat.webp" data-label="Cloudshare nexora chat" data-ratio="1.003" aria-label="Open Cloudshare nexora chat"><img src="../work/ad-cloudshare-nexora-chat.webp" alt="Social Media Ads — Cloudshare nexora chat" width="338" height="339" loading="lazy" decoding="async"></a></div>
      <div class="row n3"><a class="piece rv" style="--w:339;--h:339;--d:2" href="../work/ad-arato-from-to.webp" data-label="Arato from to" data-ratio="1.000" aria-label="Open Arato from to"><img src="../work/ad-arato-from-to.webp" alt="Social Media Ads — Arato from to" width="339" height="339" loading="lazy" decoding="async"></a><a class="piece rv" style="--w:339;--h:339;--d:3" href="../work/ad-bosch-tmdi-mega-sale.webp" data-label="Bosch tmdi mega sale" data-ratio="1.000" aria-label="Open Bosch tmdi mega sale"><img src="../work/ad-bosch-tmdi-mega-sale.webp" alt="Social Media Ads — Bosch tmdi mega sale" width="339" height="339" loading="lazy" decoding="async"></a><a class="piece rv" style="--w:338;--h:339;--d:0" href="../work/ad-km-columbus-voyage.webp" data-label="Km columbus voyage" data-ratio="1.003" aria-label="Open Km columbus voyage"><img src="../work/ad-km-columbus-voyage.webp" alt="Social Media Ads — Km columbus voyage" width="338" height="339" loading="lazy" decoding="async"></a></div>
      <div class="row n3"><a class="piece rv" style="--w:339;--h:339;--d:1" href="../work/ad-americanstandard-spectra-etouch.webp" data-label="Americanstandard spectra etouch" data-ratio="1.000" aria-label="Open Americanstandard spectra etouch"><img src="../work/ad-americanstandard-spectra-etouch.webp" alt="Social Media Ads — Americanstandard spectra etouch" width="339" height="339" loading="lazy" decoding="async"></a><a class="piece rv" style="--w:339;--h:339;--d:2" href="../work/ad-pldt-valentines.webp" data-label="Pldt valentines" data-ratio="1.000" aria-label="Open Pldt valentines"><img src="../work/ad-pldt-valentines.webp" alt="Social Media Ads — Pldt valentines" width="339" height="339" loading="lazy" decoding="async"></a><a class="piece rv" style="--w:338;--h:339;--d:3" href="../work/ad-ff-fall-asleep-3am.webp" data-label="Ff fall asleep 3am" data-ratio="1.003" aria-label="Open Ff fall asleep 3am"><img src="../work/ad-ff-fall-asleep-3am.webp" alt="Social Media Ads — Ff fall asleep 3am" width="338" height="339" loading="lazy" decoding="async"></a></div>
  </section>

  <nav class="next" aria-label="Next folder">
    <span>Next folder</span>
    <a href="../social-media-content/">Social Media Content<span class="ic ic22"><img src="../work/ic-next.svg" alt=""></span></a>
  </nav>
</main>

<dialog class="viewer" id="viewer" aria-labelledby="vCap">
  <div class="v-head"><b id="vCap"></b><button class="v-close" type="button" id="vClose" aria-label="Close">✕</button></div>
  <div class="v-stage">
    <div class="v-scroll" id="vScroll"><img id="vImg" alt=""></div>
    <button class="v-nav v-prev" type="button" id="vPrev" aria-label="Previous piece">←</button>
    <button class="v-nav v-next" type="button" id="vNext" aria-label="Next piece">→</button>
  </div>
  <div class="v-foot"><span>Social Media Ads</span><span id="vCount"></span></div>
</dialog>

<script>
(function(){
  var els=document.querySelectorAll('.rv');
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -5% 0px',threshold:.04});
    els.forEach(function(el){io.observe(el);});
  } else els.forEach(function(el){el.classList.add('in');});

  var pieces=[].slice.call(document.querySelectorAll('.piece')), dlg=document.getElementById('viewer'),
      wrap=document.getElementById('vScroll'), img=document.getElementById('vImg'), cap=document.getElementById('vCap'),
      count=document.getElementById('vCount'), idx=0;
  function show(n){
    idx=(n+pieces.length)%pieces.length; var p=pieces[idx], src=p.getAttribute('href');
    img.style.animation='none'; void img.offsetWidth; img.style.animation='';
    wrap.classList.toggle('tall', +p.dataset.ratio>1.6); wrap.scrollTop=0;
    img.src=src; img.alt=p.querySelector('img').alt; cap.textContent=p.dataset.label;
    count.textContent=(idx+1)+' / '+pieces.length;
  }
  pieces.forEach(function(p,i){p.addEventListener('click',function(e){
    if(e.metaKey||e.ctrlKey||e.shiftKey) return; e.preventDefault(); show(i);
    if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
  });});
  document.getElementById('vPrev').addEventListener('click',function(){show(idx-1);});
  document.getElementById('vNext').addEventListener('click',function(){show(idx+1);});
  document.getElementById('vClose').addEventListener('click',function(){dlg.close();});
  dlg.addEventListener('click',function(e){if(e.target===dlg) dlg.close();});
  dlg.addEventListener('close',function(){var p=pieces[idx]; if(p) p.focus({preventScroll:true});});
  dlg.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){show(idx-1);e.preventDefault();}
    if(e.key==='ArrowRight'){show(idx+1);e.preventDefault();}
  });
  var sx=null;
  dlg.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  dlg.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(idx+(dx<0?1:-1));sx=null;});

  /* Esc on the page (viewer closed) goes back to all projects, like the close button */
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !dlg.open) location.href='../'; });
})();
</script>
</body>
</html>
